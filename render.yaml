databases:
  - name: ecommerce-postgres
    databaseName: shop
    user: ecommerce_user
    plan: free

services:
  - type: web
    name: ecommerce-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    autoDeploy: true
    healthCheckPath: /api/products
    envVars:
      - key: PORT
        value: 10000
      # Ensures RabbitMQ/Redis are not pointed at localhost unless you override (see RenderIntegrationEnvironmentPostProcessor).
      - key: RENDER
        value: "true"
      # Render also sets RENDER_EXTERNAL_URL automatically; RENDER above covers blueprint/manual deploys.
      # Render Postgres: use connectionString (host/port are not valid fromDatabase properties for Postgres).
      - key: DATABASE_URL
        fromDatabase:
          name: ecommerce-postgres
          property: connectionString
      # Public site URL(s). CORS defaults to this (see application.cors.allowed-origins).
      - key: FRONTEND_URL
        sync: false
      # Optional: comma-separated if you have several Vercel preview URLs (must match browser origin exactly).
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Backend public URL, e.g. https://ecommerce-backend.onrender.com
      - key: APPLICATION_SERVER_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: INTERNAL_NOTIFY_TOKEN
        generateValue: true
      - key: SPRING_MAIL_HOST
        value: smtp.gmail.com
      - key: SPRING_MAIL_PORT
        value: "587"
      - key: SPRING_MAIL_USERNAME
        sync: false
      - key: SPRING_MAIL_PASSWORD
        sync: false
      # Google login: set both IDs, then add SPRING_PROFILES_INCLUDE=oauth in the dashboard (not in this file).
      - key: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID
        sync: false
      - key: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET
        sync: false
      - key: SPRING_RABBITMQ_ENABLED
        sync: false
      - key: SPRING_RABBITMQ_URI
        sync: false
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        value: "6379"
      - key: VNPAY_HASH_SECRET
        sync: false
      - key: ADMIN_BOOTSTRAP_ENABLED
        value: "true"
      - key: ADMIN_BOOTSTRAP_EMAIL
        sync: false
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false
      - key: ADMIN_BOOTSTRAP_FIRST_NAME
        value: Admin
      - key: ADMIN_BOOTSTRAP_LAST_NAME
        value: User

  - type: web
    name: ecommerce-frontend
    runtime: docker
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    plan: free
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: DB_CLIENT
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: ecommerce-postgres
          property: connectionString
      # Public URL of the backend service. Update in Render dashboard after deployment.
      - key: NEXT_PUBLIC_BACKEND_URL
        sync: false
      - key: NEXT_PUBLIC_API_URL
        sync: false
      # Internal token — must match backend INTERNAL_NOTIFY_TOKEN
      - key: INTERNAL_NOTIFY_TOKEN
        sync: false
      # VNPay (must match backend)
      - key: VNPAY_TMN_CODE
        sync: false
      - key: VNPAY_HASH_SECRET
        sync: false
      - key: VNPAY_URL
        value: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
      - key: VNPAY_RETURN_URL
        sync: false

