name: ai-mcp-ci

on:
  pull_request:
    paths:
      - 'mcp-server/**'
      - 'ai-chatbot-platform/**'
      - '.github/workflows/ai-mcp-ci.yml'
  push:
    branches: [main]
    paths:
      - 'mcp-server/**'
      - 'ai-chatbot-platform/**'
      - '.github/workflows/ai-mcp-ci.yml'

# FIX H1: Least-privilege permissions.
permissions:
  contents: read

jobs:
  mcp-server-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test --if-present
      - run: npm audit --audit-level=high

  ai-backend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-chatbot-platform/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          # FIX H2: Add npm cache to avoid re-downloading on every run.
          cache: npm
          cache-dependency-path: ai-chatbot-platform/backend/package-lock.json
      # FIX H3: Fail explicitly if package-lock.json is missing instead of
      # falling back to non-deterministic `npm install`.
      - name: Verify lockfile exists
        run: |
          if [ ! -f package-lock.json ]; then
            echo "ERROR: package-lock.json is missing. Commit it to ensure reproducible builds."
            exit 1
          fi
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
      - run: npm run test --if-present
      - run: npm audit --audit-level=high
      - name: Upload AI backend artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-backend-test-artifacts
          path: |
            ai-chatbot-platform/backend/coverage/**
            ai-chatbot-platform/backend/test-results/**

  ai-frontend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-chatbot-platform/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          # FIX H2: Add npm cache.
          cache: npm
          cache-dependency-path: ai-chatbot-platform/frontend/package-lock.json
      # FIX H3: Fail explicitly if package-lock.json is missing.
      - name: Verify lockfile exists
        run: |
          if [ ! -f package-lock.json ]; then
            echo "ERROR: package-lock.json is missing. Commit it to ensure reproducible builds."
            exit 1
          fi
      - run: npm ci --legacy-peer-deps
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm run test --if-present
      - run: npm audit --audit-level=high
