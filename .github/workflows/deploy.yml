name: deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options: [staging, production]
      image_tag:
        description: 'Docker tag to deploy (sha-... or semver)'
        required: true
        type: string

concurrency:
  group: deploy-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy
        env:
          DEPLOY_CMD: ${{ secrets.DEPLOY_CMD }}
          IMAGE_TAG: ${{ github.event.inputs.image_tag }}
          TARGET_ENV: ${{ github.event.inputs.environment }}
        run: |
          if [ -z "$DEPLOY_CMD" ]; then
            echo "DEPLOY_CMD is missing"
            exit 1
          fi
          sh -c "$DEPLOY_CMD"

      - name: Health checks
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          if [ -z "$HEALTHCHECK_URL" ]; then
            echo "HEALTHCHECK_URL is missing"
            exit 1
          fi
          for i in $(seq 1 15); do
            status=$(curl -sk -o /dev/null -w "%{http_code}" "$HEALTHCHECK_URL")
            if [ "$status" = "200" ]; then
              echo "Health check passed"
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed"
          exit 1

      - name: Smoke tests
        env:
          SMOKE_BASE_URL: ${{ secrets.SMOKE_BASE_URL }}
        run: ./.github/scripts/smoke-test.sh "$SMOKE_BASE_URL"

      - name: Rollback on failure
        if: failure()
        env:
          ROLLBACK_CMD: ${{ secrets.ROLLBACK_CMD }}
        run: ./.github/scripts/rollback.sh
