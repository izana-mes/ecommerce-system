name: deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options: [staging, production]
      image_tag:
        description: 'Docker tag to deploy (sha-... or semver)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy
        env:
          DEPLOY_CMD: ${{ secrets.DEPLOY_CMD }}
          IMAGE_TAG: ${{ github.event.inputs.image_tag }}
          TARGET_ENV: ${{ github.event.inputs.environment }}
        run: |
          if [ -z "$DEPLOY_CMD" ]; then
            echo "DEPLOY_CMD secret is missing — cannot deploy."
            exit 1
          fi
          sh -c "$DEPLOY_CMD"

      - name: Health checks
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          if [ -z "$HEALTHCHECK_URL" ]; then
            echo "HEALTHCHECK_URL secret is missing."
            exit 1
          fi
          for i in $(seq 1 15); do
            status=$(curl -sk -o /dev/null -w "%{http_code}" "$HEALTHCHECK_URL")
            if [ "$status" = "200" ]; then
              echo "Health check passed (attempt $i)"
              exit 0
            fi
            echo "Attempt $i: status=$status — retrying in 10s..."
            sleep 10
          done
          echo "Health check failed after 15 attempts"
          exit 1

      - name: Smoke tests
        env:
          SMOKE_BASE_URL: ${{ secrets.SMOKE_BASE_URL }}
        run: ./.github/scripts/smoke-test.sh "$SMOKE_BASE_URL"

      # FIX M8: Run rollback AND re-verify health after rollback, so a silent
      # rollback failure is surfaced as a CI failure rather than passing silently.
      - name: Rollback on failure
        if: failure()
        env:
          ROLLBACK_CMD: ${{ secrets.ROLLBACK_CMD }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          ./.github/scripts/rollback.sh
          echo "Rollback executed. Re-verifying health after rollback..."
          for i in $(seq 1 10); do
            status=$(curl -sk -o /dev/null -w "%{http_code}" "$HEALTHCHECK_URL")
            if [ "$status" = "200" ]; then
              echo "Service healthy after rollback (attempt $i)"
              exit 0
            fi
            echo "Attempt $i: status=$status — retrying in 10s..."
            sleep 10
          done
          echo "CRITICAL: Service is NOT healthy even after rollback!"
          exit 1
