name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read
  security-events: write

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: npm audit frontend
        run: cd frontend && npm ci && npm audit --audit-level=high
      - name: npm audit mcp-server
        run: cd mcp-server && npm ci && npm audit --audit-level=high
      - name: npm audit ai backend
        run: cd ai-chatbot-platform/backend && ([ -f package-lock.json ] && npm ci || npm install) && npm audit --audit-level=high
      - name: npm audit ai frontend
        run: cd ai-chatbot-platform/frontend && ([ -f package-lock.json ] && npm ci || npm install) && npm audit --audit-level=high

  trivy-fs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-fs.sarif
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
