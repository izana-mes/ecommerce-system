name: backend-ci

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  # FIX M6: Run OWASP scan nightly at 02:00 UTC only (not on every PR/push).
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

# FIX H1: Least-privilege permissions — read source only; no package-write here.
permissions:
  contents: read

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: shop
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shop"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: shop
      DB_USER: postgres
      DB_PASSWORD: postgres
      # Explicit host/port expected by test/resources/application.yml
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      # URL form expected by main application.yml
      SPRING_DATA_REDIS_URL: redis://localhost:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # FIX C2 + C3: A single `mvn verify` handles the full lifecycle:
      #   validate (Checkstyle) → compile → test (Surefire) →
      #   integration-test (Failsafe) → verify (SpotBugs + JaCoCo report).
      # Previous workflow ran: `clean compile` → `clean verify` → `checkstyle:check`
      # → `spotbugs:check` — two full compilations and duplicate quality tool runs.
      - name: Build, test & quality gates
        run: mvn -B -ntp clean verify

      - name: Upload test & quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: |
            backend/target/site/checkstyle.html
            backend/target/spotbugsXml.xml
            backend/target/site/jacoco/**

  # FIX M6: OWASP dependency-check is slow (~15 min) and rate-limits without
  # an NVD API key. Isolated to schedule/workflow_dispatch only.
  owasp-dependency-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Cache NVD database
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: owasp-nvd-${{ runner.os }}-${{ hashFiles('backend/pom.xml') }}
          restore-keys: owasp-nvd-${{ runner.os }}-

      - name: OWASP dependency-check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          EXTRA_ARGS=""
          if [ -n "$NVD_API_KEY" ]; then
            EXTRA_ARGS="-DnvdApiKey=$NVD_API_KEY"
          fi
          mvn -B -ntp org.owasp:dependency-check-maven:check $EXTRA_ARGS

      - name: Upload OWASP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-security-reports
          path: backend/target/dependency-check-report.*
