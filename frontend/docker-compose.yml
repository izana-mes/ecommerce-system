services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "08092005"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d shop" ]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 20

  backend:
    build: ../backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: shop
      DB_USER: postgres
      DB_PASSWORD: "08092005"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      INTERNAL_NOTIFY_TOKEN: "change-me-in-env"
      VNPAY_HASH_SECRET: "BVJUNHLRJVJ5U6MQSL1WHVCHN1V2J1D4"
      SPRING_MAIL_HOST: smtp.gmail.com
      SPRING_MAIL_PORT: 587
      SPRING_MAIL_USERNAME: "nguyennguyenhuy357@gmail.com"
      SPRING_MAIL_PASSWORD: "eulalawrence"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  frontend:
    build: .
    restart: always
    ports:
      - "3000:3000"
    environment:
      # Used by Next.js route handlers (server-side) to call the backend from inside Docker.
      NEXT_PUBLIC_API_URL: http://backend:8080/api
      INTERNAL_NOTIFY_TOKEN: "change-me-in-env"
      DB_CLIENT: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: shop
      DB_USER: postgres
      DB_PASSWORD: "08092005"
      VNPAY_TMN_CODE: "1993TQTF"
      VNPAY_HASH_SECRET: "BVJUNHLRJVJ5U6MQSL1WHVCHN1V2J1D4"
      VNPAY_URL: "https://sandbox.vnpayment.vn/paymentv2/vpcpay.html"
      VNPAY_RETURN_URL: "http://localhost:3000/payment/vnpay-return"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
